<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Category — Bargain Drop v9</title>
<style>
:root{--bg:#fff;--fg:#111;--muted:#777;--line:#eee;--red:#e60023}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);padding-bottom:80px}
a{color:inherit;text-decoration:none}img{display:block}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#fff;position:sticky;top:0;z-index:109;border-bottom:1px solid var(--line)}
.top-bar a{font-size:0.75rem;font-weight:600;color:var(--muted)}
.top-bar div{font-size:0.6rem;color:#10b981;font-weight:600}
.page-header{padding:14px 14px 0}
.breadcrumb{font-size:0.6rem;color:var(--muted);margin-bottom:4px}
.page-header h1{font-size:1.1rem;font-weight:800}
.count{font-size:0.65rem;color:var(--muted);margin-top:2px}
.subcat-chips{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:wrap}
.subcat-chip{flex-shrink:0;padding:6px 12px;border-radius:16px;border:1.5px solid var(--line);font-size:0.62rem;cursor:pointer;background:#fff;white-space:nowrap}
.subcat-chip.active{background:var(--fg);color:#fff;border-color:var(--fg)}
.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 14px 16px}
.product-card{border-radius:10px;overflow:hidden;border:1.5px solid var(--line);background:#fff;transition:all .15s}
.product-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.prod-img{aspect-ratio:1;background:#f5f5f5;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.prod-img img{width:100%;height:100%;object-fit:cover}
.prod-badge{position:absolute;top:4px;left:4px;background:var(--red);color:#fff;font-size:0.55rem;font-weight:700;padding:2px 5px;border-radius:4px}
.prod-info{padding:6px 8px 8px}
.prod-title{font-size:0.7rem;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-bottom:4px}
.prod-price-row{display:flex;align-items:center;gap:6px}
.prod-price{font-size:0.85rem;font-weight:800;color:var(--red)}
.prod-compare{font-size:0.6rem;color:var(--muted);text-decoration:line-through}
.prod-discount{font-size:0.55rem;color:#10b981;font-weight:600}
.loading{text-align:center;padding:60px;color:var(--muted)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:120;padding:4px 0}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px;font-size:0.6rem;color:var(--muted);text-decoration:none}
.bottom-nav a.active,.bottom-nav a:hover{color:var(--fg)}
.nav-icon{width:20px;height:20px;flex-shrink:0}
</style>
</head>
<body>
<div class="top-bar"><a href="categories.html"><a href="javascript:history.back()" style="cursor:pointer">← Back</a> Categories</a><div>Free $29+</div></div>
<div id="loading" class="loading"><p>Loading...</p></div>
<div id="content" style="display:none">
<div class="page-header"><div class="breadcrumb"><a href="/">Home</a> → <a href="categories.html">Categories</a></div><h1 id="title"></h1><div class="count" id="count"></div></div>
<div class="subcat-chips" id="subcats"></div>
<div class="product-grid" id="grid"></div>
</div>
<nav class="bottom-nav">
  <a href="/"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3" fill="none" stroke="#777" stroke-width="2"/></svg>Home</a>
  <a href="products.html"><svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="3" fill="none" stroke="#777" stroke-width="1.5" width="7" height="7" rx="1"/><rect x="14" y="3" fill="none" stroke="#777" stroke-width="1.5" width="7" height="7" rx="1"/></svg>Products</a>
  <a href="categories.html"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke="#777" stroke-width="2"/></svg>Categories</a>
  <a href="profile.html"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" fill="none" stroke="#777" stroke-width="2"/><circle cx="12" cy="7" r="4" fill="none" stroke="#777" stroke-width="2"/></svg>Me</a>
</nav>
<script>
function esc(t){return(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
async function load(){
var p=new URLSearchParams(location.search),cat=p.get("cat");
if(!cat){document.getElementById("loading").innerHTML="<p>No category specified</p>";return}
try{
var r=await fetch("categories-data.json"),d=await r.json();
var cd=d[cat];
if(!cd){document.getElementById("loading").innerHTML="<p>Category not found: "+esc(cat)+"</p>";return}
var prods=cd.products||[];
if(!prods.length){document.getElementById("loading").innerHTML="<p>No products in this category</p>";return}
document.getElementById("loading").style.display="none";
document.getElementById("content").style.display="block";
document.getElementById("title").textContent=cat;
document.getElementById("count").textContent=prods.length+" products";
var sc=document.getElementById("subcats");
var subs=cd.subcategories||[];
sc.innerHTML='<div class="subcat-chip active" onclick="renderProds(null,this)">All</div>';
subs.forEach(function(s){sc.innerHTML+='<div class="subcat-chip" data-sub="'+esc(s.title)+'" onclick="renderProds(\''+esc(s.title)+'\',this)">'+esc(s.title)+" ("+s.count+")</div>";});
renderProdsGrid(prods);
}catch(e){document.getElementById("loading").innerHTML="<p>Error: "+e.message+"</p>"}
}
function renderProds(sub,el){
if(el){document.querySelectorAll(".subcat-chip").forEach(function(c){c.classList.remove("active")});el.classList.add("active")}
var params2=new URLSearchParams(location.search),cat2=params2.get("cat");
fetch("categories-data.json").then(function(r){return r.json()}).then(function(d){
var prods=(d[cat2]||{}).products||[];
if(sub){prods=prods.filter(function(p){return p.subcategory===sub})}
renderProdsGrid(prods);
}).catch(function(){});
}
function renderProdsGrid(prods){
var g=document.getElementById("grid");
if(!prods.length){g.innerHTML='<p style="text-align:center;padding:40px;grid-column:1/-1;color:var(--muted)">No products found</p>';return}
g.innerHTML="";
prods.slice(0,100).forEach(function(p){
var img=p.image||"";
var disc="";
if(p.compare_at_price&&p.compare_at_price>p.price){disc='<div class="prod-badge">-'+Math.round((1-p.price/p.compare_at_price)*100)+"%</div>"}
var c=document.createElement("a");
c.className="product-card";c.href="product.html?id="+p.id;
c.innerHTML='<div class="prod-img">'+disc+(img?'<img src="'+img+'" alt="" loading="lazy">':'<div style="font-size:4rem;opacity:.2">📦</div>')+'</div><div class="prod-info"><div class="prod-title">'+esc(p.title)+'</div><div class="prod-price-row"><span class="prod-price">$'+(p.price||0).toFixed(2)+'</span>'+(p.compare_at_price&&p.compare_at_price>p.price?'<span class="prod-compare">$'+p.compare_at_price.toFixed(2)+"</span>":"")+(disc?'<span class="prod-discount">-'+Math.round((1-p.price/p.compare_at_price)*100)+"%</span>":"")+"</div></div>";
g.appendChild(c);
});
}
load();
</script>
</body>
</html>
