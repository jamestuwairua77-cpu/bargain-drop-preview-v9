<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>All Products — Bargain Drop v9</title>
<style>
:root{--bg:#fff;--fg:#111;--muted:#777;--line:#eee;--red:#e60023}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);padding-bottom:80px}
a{color:inherit;text-decoration:none}img{display:block}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#fff;position:sticky;top:0;z-index:109;border-bottom:1px solid var(--line)}
.top-bar a{font-size:0.75rem;font-weight:600;color:var(--muted)}
.top-bar h1{font-size:0.95rem;font-weight:800}
.search-wrap{padding:8px 14px}
.search-box{display:flex;align-items:center;background:#f5f5f5;border-radius:20px;padding:8px 14px;gap:8px;border:1.5px solid transparent}
.search-box:focus-within{border-color:#111;background:#fff}
.search-box input{border:none;background:none;outline:none;flex:1;font-size:0.78rem}
.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:8px 14px 16px}
.product-card{border-radius:10px;overflow:hidden;border:1.5px solid var(--line);background:#fff}
.product-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.prod-img{aspect-ratio:1;background:#f5f5f5;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.prod-img img{width:100%;height:100%;object-fit:cover}
.prod-badge{position:absolute;top:4px;left:4px;background:var(--red);color:#fff;font-size:0.55rem;font-weight:700;padding:2px 5px;border-radius:4px}
.prod-info{padding:6px 8px 8px}
.prod-title{font-size:0.7rem;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-bottom:4px}
.prod-price-row{display:flex;align-items:center;gap:6px}
.prod-price{font-size:0.85rem;font-weight:800;color:var(--red)}
.prod-compare{font-size:0.6rem;color:var(--muted);text-decoration:line-through}
.load-more{text-align:center;padding:16px}
.load-more button{padding:10px 32px;border-radius:20px;border:1.5px solid var(--fg);background:#fff;font-size:0.72rem;font-weight:700;cursor:pointer}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:120;padding:4px 0}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px;font-size:0.6rem;color:var(--muted);text-decoration:none}
.bottom-nav a.active,.bottom-nav a:hover{color:var(--fg)}
.nav-icon{width:20px;height:20px}
</style>
</head>
<body>
<div class="top-bar"><a href="/">← Home</a><h1>All Products</h1><span id="total-count"></span></div>
<div class="search-wrap"><div class="search-box"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="search-input" type="text" placeholder="Search all products..." oninput="searchProducts()"></div></div>
<div class="product-grid" id="product-grid"><div style="text-align:center;padding:40px;grid-column:1/-1;color:var(--muted)">Loading products...</div></div>
<div class="load-more" id="load-more" style="display:none"><button onclick="loadMore()">Load More</button></div>
<nav class="bottom-nav">
  <a href="/"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3" fill="none" stroke="#777" stroke-width="2"/></svg>Home</a>
  <a href="products.html" class="active"><svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="3" fill="none" stroke="#777" stroke-width="1.5" width="7" height="7" rx="1"/><rect x="14" y="3" fill="none" stroke="#777" stroke-width="1.5" width="7" height="7" rx="1"/></svg>Products</a>
  <a href="categories.html"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke="#777" stroke-width="2"/></svg>Categories</a>
  <a href="profile.html"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" fill="none" stroke="#777" stroke-width="2"/><circle cx="12" cy="7" r="4" fill="none" stroke="#777" stroke-width="2"/></svg>Me</a>
</nav>
<script>
var allProducts=[],displayed=0,pageSize=50,filtered=[];
function esc(t){return(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function renderPage(prods){
  var grid=document.getElementById("product-grid");
  if(!displayed){grid.innerHTML=""}
  var slice=prods.slice(displayed,displayed+pageSize);
  displayed+=slice.length;
  slice.forEach(function(p){
    var img=p.image||(p.images||[])[0]||"";
    var c=document.createElement("a");
    c.className="product-card";c.href="product.html?id="+p.id;
    var disc="";
    if(p.compare_at_price&&p.compare_at_price>p.price){disc='<div class="prod-badge">-'+Math.round((1-p.price/p.compare_at_price)*100)+"%</div>"}
    c.innerHTML='<div class="prod-img">'+disc+(img?'<img src="'+img+'" alt="" loading="lazy">':'<div style="font-size:4rem;opacity:.2">📦</div>')+'</div><div class="prod-info"><div class="prod-title">'+esc(p.title)+'</div><div class="prod-price-row"><span class="prod-price">$'+(p.price||0).toFixed(2)+'</span>'+(p.compare_at_price&&p.compare_at_price>p.price?'<span class="prod-compare">$'+(p.compare_at_price).toFixed(2)+"</span>":"")+"</div></div>";
    grid.appendChild(c);
  });
  document.getElementById("load-more").style.display=displayed>=prods.length?"none":"block";
}
function loadAll(){
  var cached=localStorage.getItem("bd_all_products");
  if(cached){try{var arr=JSON.parse(cached);allProducts=arr;initProducts();return}catch(e){}}
  var xhr=new XMLHttpRequest();
  xhr.open("GET","categories-data.json",true);xhr.timeout=20000;
  xhr.onload=function(){
    if(xhr.status===200){
      try{
        var d=JSON.parse(xhr.responseText);var arr=[];
        for(var c in d){arr=arr.concat(d[c].products||[])}
        allProducts=arr;localStorage.setItem("bd_all_products",JSON.stringify(arr));
        initProducts();
      }catch(e){}
    }
  };
  xhr.onerror=function(){
    document.getElementById("product-grid").innerHTML='<div style="text-align:center;padding:40px;grid-column:1/-1;color:var(--muted)">Failed to load products</div>';
  };
  xhr.send();
}
function initProducts(){
  filtered=allProducts;
  document.getElementById("total-count").textContent=allProducts.length.toLocaleString()+" products";
  displayed=0;document.getElementById("product-grid").innerHTML="";renderPage(filtered);
}
function loadMore(){renderPage(filtered)}
function searchProducts(){
  var q=document.getElementById("search-input").value.toLowerCase().trim();
  if(!q){filtered=allProducts}else{filtered=allProducts.filter(function(p){return(p.title||"").toLowerCase().indexOf(q)>=0})}
  displayed=0;document.getElementById("product-grid").innerHTML="";renderPage(filtered);
}
loadAll();
</script>
</body>
</html>
